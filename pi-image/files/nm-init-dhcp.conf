# /etc/NetworkManager/conf.d/10-flyingfish-init.conf
#
# Init phase: every wired NIC (built-in ethernet + any USB ethernet) comes up as
# an INDEPENDENT DHCP client, so a freshly-flashed Pi is reachable via SSH and
# the FlyingFish web UI on whichever port is plugged into a network with DHCP.
#
# FlyingFish's `netdevice` part stays completely hands-off until you assign a
# `wan`/`lan` role to a NIC in the web UI, so this dual-DHCP state persists
# through the whole "boot → configure in the web UI → re-plug WAN/LAN" flow.
# Roles are matched by MAC address, so moving a cable to another socket after
# configuring does not change which NIC is WAN vs LAN.

[main]
# Empty = do NOT suppress auto-default for any device: NetworkManager creates a
# DHCP (ipv4 + ipv6 = auto) default connection for every managed wired device
# that has no stored profile. This is the mechanism that gives BOTH eth ports
# an address at once.
no-auto-default=

[device]
# Make sure every ethernet device is managed by NetworkManager (never left
# unmanaged), regardless of its OS name (eth0, enx<mac>, ...).
match-device=type:ethernet
managed=1
