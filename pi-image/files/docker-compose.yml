# /opt/flyingfish/docker-compose.yml
#
# Pi-specific compose file for the FlyingFish router node (router-minimal / Pi-3
# profile). Tuned to fit ~905 MiB RAM on a Raspberry Pi 3.
#
#  - Every service uses `image:` with the LOCAL baked tag; NO `build:` — images
#    are pre-loaded by firstboot.sh from /opt/flyingfish/flyingfish.tar.
#  - Secrets come from /opt/flyingfish/.env (generated on first boot).
#  - netfilter + netdevice run with network_mode: host + NET_ADMIN.
#
# REMOVED from the stack entirely (no longer in the codebase):
#   - influxdb  : metrics timeseries — removed; the request-stream chart is gone.
#   - redis     : all inter-service IPC moved to HTTP; sessions are in-process.
#   - himhip    : folded into netdevice (host facts reported over HTTP).
# DROPPED for RAM (still optional for a single-node router):
#   - clusterserver : cluster mesh, not needed on a single node.
#   - sshserver / ddnsserver : SSH-tunnel + DynDNS-client features, optional.
# Re-add the optional ones (and give the box more RAM, e.g. a Pi 4/5) if you want
# the full feature set. Core router keeps: mariadb, backend, pkiserver,
# nginxserver, dnsserver (LAN resolver), netfilter, netdevice.

services:
  mariadb:
    image: mariadb:lts
    container_name: flyingfish_db
    restart: unless-stopped
    environment:
      MARIADB_AUTO_UPGRADE: '1'
      MARIADB_INITDB_SKIP_TZINFO: '1'
      MYSQL_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: "${MARIADB_DATABASE}"
    healthcheck:
      test: [ "CMD", "mariadb", "-u${MARIADB_ROOT_USERNAME}", "-p${MARIADB_ROOT_PASSWORD}", "-e", "use ${MARIADB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - flyingfishDbData:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      flyingfishNet:
          ipv4_address: 10.103.0.2
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"

  flyingfish:
    image: flyingfish:v1.1.13
    container_name: flyingfish_service
    restart: unless-stopped
    hostname: flyingfish
    volumes:
      - flyingfishLetsencrypt:/etc/letsencrypt:rw
      - flyingfish:/var/lib/flyingfish:rw
      - flyingfishNginx:/opt/flyingfish/nginx:rw
      - flyingfishPkiCa:/var/lib/flyingfish-pki-ca:ro
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_HTTPSERVER_PORT: "${HTTPSERVER_PORT}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_DYNDNSSERVER_ENABLE: "${DYNDNSSERVER_ENABLE}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_PKI_CA_FILE: /var/lib/flyingfish-pki-ca/ca-pool.json
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_NGINX_SECRET: "${NGINX_SECRET}"
      FLYINGFISH_NGINX_REMOTE_URL: "${NGINX_REMOTE_URL}"
    ports:
      - "${HTTPSERVER_PORT}:${HTTPSERVER_PORT}"
      - "1900:1900"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.3
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('https').get({host:'127.0.0.1',port:3000,rejectUnauthorized:false,timeout:2000},r=>process.exit(0)).on('error',()=>process.exit(1)).on('timeout',()=>process.exit(1))" ]
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy

  nginxserver:
    image: flyingfish_nginxserver:v1.1.13
    container_name: flyingfish_nginxserver
    restart: unless-stopped
    volumes:
      - flyingfishNginx:/opt/flyingfish/nginx:rw
      - flyingfishLetsencrypt:/etc/letsencrypt:rw
      - flyingfish:/var/lib/flyingfish:ro
      - flyingfishNginxPki:/var/lib/flyingfish-pki
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_NGINX_SECRET: "${NGINX_SECRET}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "443:443"
      - "80:80"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.9
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  dnsserver:
    image: flyingfish_dns:v1.1.13
    container_name: flyingfish_dns
    restart: unless-stopped
    volumes:
      - flyingfish:/var/lib/flyingfish:ro
      - flyingfishDnsPki:/var/lib/flyingfish-pki
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "5333:5333/udp"
      - "5333:5333/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.8
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  pkiserver:
    image: flyingfish_pki:v1.1.13
    container_name: flyingfish_pki
    restart: unless-stopped
    volumes:
      - flyingfish:/var/lib/flyingfish:ro
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
      - flyingfishPkiCa:/var/lib/flyingfish-pki-ca
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      FLYINGFISH_PKISERVER_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
      FLYINGFISH_PKISERVER_CA_EXPORT_FILE: /var/lib/flyingfish-pki-ca/ca-pool.json
    ports:
      - "5334:5334/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.10
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy

  netdevice:
    image: flyingfish_netdevice:v1.1.13
    container_name: flyingfish_netdevice
    restart: unless-stopped
    volumes:
      - flyingfish:/var/lib/flyingfish:ro
      - flyingfishNetdevicePki:/var/lib/flyingfish-pki
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL_HOST}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      FLYINGFISH_PKI_URL: "http://127.0.0.1:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    network_mode: host
    cap_add:
      - NET_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

volumes:
  flyingfishDbData:
    driver: local
  flyingfish:
    driver: local
  flyingfishLetsencrypt:
    driver: local
  flyingfishNginx:
    driver: local
  flyingfishDnsPki:
    driver: local
  flyingfishNginxPki:
    driver: local
  flyingfishNetdevicePki:
    driver: local
  flyingfishPkiBootstrap:
    driver: local
  flyingfishPkiCa:
    driver: local

networks:
  flyingfishNet:
    driver: bridge
    ipam:
      config:
        -  subnet: 10.103.0.0/16
