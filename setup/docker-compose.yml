services:
  mariadb:
    image: mariadb:lts
    container_name: flyingfish_db
    environment:
      MARIADB_AUTO_UPGRADE: '1'
      MARIADB_INITDB_SKIP_TZINFO: '1'
      MYSQL_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: "${MARIADB_DATABASE}"
    healthcheck:
      test: [ "CMD", "mariadb", "-u${MARIADB_ROOT_USERNAME}", "-p${MARIADB_ROOT_PASSWORD}", "-e", "use ${MARIADB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - flyingfishDbData:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      flyingfishNet:
          ipv4_address: 10.103.0.2
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"


  redis:
    image: redis:7.2-alpine
    container_name: flyingfish_redis
    volumes:
      - flyingfishRedisData:/data
    ports:
      - '127.0.0.1:6379:6379'
    command: [
      "redis-server",
      "--save",
      "${REDIS_SAVE}",
      "--loglevel",
      "${REDIS_LOGLEVEL}",
      "--maxmemory",
      "${REDIS_MAX_MEMORY}",
      "--maxmemory-policy",
      "allkeys-lru",
      "--requirepass",
      "${REDIS_REQUIREPASS}"
    ]
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.7
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_REQUIREPASS} ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"

  flyingfish:
    image: stefanwerfling/flyingfish:latest
    container_name: flyingfish_service
    # Explicit so the container's own os.hostname() (used in the self-signed
    # cert's subjectAltName, see figtree) matches the compose-DNS name the
    # part containers use in REGISTRY_URL - not a random container id.
    hostname: flyingfish
    volumes:
      - flyingfishLetsencrypt:/etc/letsencrypt:rw
      - flyingfish:/var/lib/flyingfish:rw
      # Shared with nginxserver (9.2.2): backend still generates nginx.conf
      # into this path in remote mode, nginxserver's nginx process reads it.
      - flyingfishNginx:/opt/flyingfish/nginx:rw
      # Read-only: the CA pool the pkiserver exports, read to seed the mTLS client
      # CA (no boot dependency on the pkiserver — avoids the ordering cycle).
      - flyingfishPkiCa:/var/lib/flyingfish-pki-ca:ro
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_HTTPSERVER_PORT: "${HTTPSERVER_PORT}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_DYNDNSSERVER_ENABLE: "${DYNDNSSERVER_ENABLE}"
      FLYINGFISH_DB_REDIS_URL: "${REDIS_URL}"
      FLYINGFISH_DB_REDIS_PASSWORD: "${REDIS_REQUIREPASS}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      # Node PKI (v2 mTLS): CA pool file to authenticate part client certs against,
      # + the pkiserver URL to refresh the revocation list at runtime.
      FLYINGFISH_PKI_CA_FILE: /var/lib/flyingfish-pki-ca/ca-pool.json
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      # nginx runs in its own container (nginxserver, 9.2.2) - this pair flips
      # NginxService into remote mode instead of spawning nginx locally here.
      FLYINGFISH_NGINX_SECRET: "${NGINX_SECRET}"
      FLYINGFISH_NGINX_REMOTE_URL: "${NGINX_REMOTE_URL}"
    ports:
      - "${HTTPSERVER_PORT}:${HTTPSERVER_PORT}"
      - "1900:1900"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.3
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    healthcheck:
      # Gates the part containers below (they trust this cert via
      # NODE_EXTRA_CA_CERTS, see 9.2.1) - only mark this container healthy once
      # the self-signed cert has actually been generated/persisted.
      test: [ "CMD", "test", "-f", "/var/lib/flyingfish/ssl/server.crt" ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginxserver:
    image: stefanwerfling/flyingfish_nginxserver:latest
    container_name: flyingfish_nginxserver
    volumes:
      - flyingfishNginx:/opt/flyingfish/nginx:rw
      - flyingfishLetsencrypt:/etc/letsencrypt:rw
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishNginxPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_NGINX_SECRET: "${NGINX_SECRET}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "443:443"
      - "80:80"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.9
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  himhip:
    image: stefanwerfling/flyingfish_himip:latest
    container_name: flyingfish_himhip
    volumes:
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishHimhipPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_DB_REDIS_URL: "${REDIS_URL}"
      FLYINGFISH_DB_REDIS_PASSWORD: "${REDIS_REQUIREPASS}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL_HOST}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      # network_mode: host - reach the host-published pkiserver via loopback.
      FLYINGFISH_PKI_URL: "http://127.0.0.1:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    network_mode: host
    cap_add:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      redis:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  sshremote:
    image: stefanwerfling/flyingfish_ssh:latest
    container_name: flyingfish_ssh
    volumes:
      # /var/lib/flyingfish is mounted read-only below (CA cert trust) - this
      # nested mount at the actual SSH host-key path (flyingfish_sshpath default,
      # see sshserver/inc/Config/Config.ts) takes precedence and stays writable.
      - flyingfishSsh:/var/lib/flyingfish/ssh:rw
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishSshPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_DB_REDIS_URL: "${REDIS_URL}"
      FLYINGFISH_DB_REDIS_PASSWORD: "${REDIS_REQUIREPASS}"
      FLYINGFISH_HTTPSERVER_PORT: "${HTTPSERVER_PORT}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "2222:22"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.4
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  ddnsserver:
    image: stefanwerfling/flyingfish_ddns:latest
    container_name: flyingfish_ddns
    volumes:
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishDdnsPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.6
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  dnsserver:
    image: stefanwerfling/flyingfish_dns:latest
    container_name: flyingfish_dns
    volumes:
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishDnsPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "5333:5333/udp"
      - "5333:5333/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.8
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  pkiserver:
    image: stefanwerfling/flyingfish_pki:latest
    container_name: flyingfish_pki
    volumes:
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Shared bootstrap socket: the pkiserver vends single-use enrollment tokens
      # to co-located parts here (9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
      # Shared CA pool: the pkiserver exports root + intermediates here for the
      # Hub to read (mTLS client CA, avoids the boot ordering cycle).
      - flyingfishPkiCa:/var/lib/flyingfish-pki-ca
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      FLYINGFISH_PKISERVER_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
      FLYINGFISH_PKISERVER_CA_EXPORT_FILE: /var/lib/flyingfish-pki-ca/ca-pool.json
    ports:
      - "5334:5334/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.10
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy

  clusterserver:
    image: stefanwerfling/flyingfish_cluster:latest
    container_name: flyingfish_cluster
    volumes:
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable node identity (the shared flyingfish volume is read-only).
      - flyingfishClusterPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: fetch a single-use cluster enrollment token.
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (cluster identity, 9.5.9): enroll under the cluster CA purpose;
      # the bootstrap token is fetched from the pkiserver over the shared socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "5335:5335/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.11
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

volumes:
  flyingfishDbData:
    driver: local
  flyingfish:
    driver: local
  flyingfishLetsencrypt:
    driver: local
  flyingfishSsh:
    driver: local
  flyingfishRedisData:
    driver: local
  flyingfishNginx:
    driver: local
  flyingfishDnsPki:
    driver: local
  flyingfishDdnsPki:
    driver: local
  flyingfishSshPki:
    driver: local
  flyingfishNginxPki:
    driver: local
  flyingfishHimhipPki:
    driver: local
  flyingfishClusterPki:
    driver: local
  flyingfishPkiBootstrap:
    driver: local
  flyingfishPkiCa:
    driver: local

networks:
  flyingfishNet:
    driver: bridge
    ipam:
      config:
        -  subnet: 10.103.0.0/16
