[package]
name = "netfilternft"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "FlyingFish netfilter router — native nftables binding (rustables/netlink) behind the netfilter part"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi9"] }
napi-derive = "2"
rustables = "0.8"
# rtnetlink: program the kernel routing table (delegated-PD routes) over netlink, so route
# installation is a native binding like the nftables one — not a shell-out to `ip`.
rtnetlink = "0.14"
tokio = { version = "1", features = ["rt", "net", "time"] }
futures = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
