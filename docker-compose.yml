services:
  mariadb:
    image: mariadb:lts
    container_name: flyingfish_db
    environment:
      MARIADB_AUTO_UPGRADE: '1'
      MARIADB_INITDB_SKIP_TZINFO: '1'
      MYSQL_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: "${MARIADB_DATABASE}"
    healthcheck:
      test: [ "CMD", "mariadb", "-u${MARIADB_ROOT_USERNAME}", "-p${MARIADB_ROOT_PASSWORD}", "-e", "use ${MARIADB_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - flyingfishDbData:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      flyingfishNet:
          ipv4_address: 10.103.0.2
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"

  influxdb:
    image: influxdb:latest
    container_name: flyingfish_influxdb
    volumes:
      - flyingfishInfluxdbData:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_STORAGE_CACHE_MAX_MEMORY_SIZE=52428800
      - INFLUXDB_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE=26214400
      - INFLUXDB_STORAGE_CACHE_SNAPSHOT_WRITE_COLD_DURATION=10s
      - INFLUXDB_STORAGE_WAL_FSYNC_DELAY=1s
      - INFLUXDB_STORAGE_INDEX_VERSION=tsi1
    ports:
      - "127.0.0.1:8086:8086"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.5
    healthcheck:
      test: "curl -f http://localhost:8086/ping"
      interval: 5s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"

  redis:
    image: redis:7.2-alpine
    container_name: flyingfish_redis
    volumes:
      - flyingfishRedisData:/data
    ports:
      - '127.0.0.1:6379:6379'
    command: [
      "redis-server",
      "--save",
      "${REDIS_SAVE}",
      "--loglevel",
      "${REDIS_LOGLEVEL}",
      "--maxmemory",
      "${REDIS_MAX_MEMORY}",
      "--maxmemory-policy",
      "allkeys-lru",
      "--requirepass",
      "${REDIS_REQUIREPASS}"
    ]
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.7
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a ${REDIS_REQUIREPASS} ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"

  flyingfish:
    image: flyingfish:v1.1.13
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_service
    # Explicit so the container's own os.hostname() (used in the self-signed
    # cert's subjectAltName, see figtree) matches the compose-DNS name the
    # part containers use in REGISTRY_URL - not a random container id.
    hostname: flyingfish
    volumes:
      - ./nginx:/opt/flyingfish/nginx:rw
      - flyingfishLetsencrypt:/etc/letsencrypt:rw
      - flyingfish:/var/lib/flyingfish:rw
      - ./backend/dist:/opt/flyingfish/backend/dist
      #- ./backend/node_modules:/opt/flyingfish/backend/node_modules
      - ./backend/package.json:/opt/flyingfish/backend/package.json
      #- ./frontend/assets:/opt/flyingfish/frontend/assets
      - ./frontend/dist:/opt/flyingfish/frontend/dist
      - ./frontend/src:/opt/flyingfish/frontend/src
      - ./node_modules:/opt/flyingfish/node_modules
      -  ./package.json:/opt/flyingfish/package.json
      - ./plugins/letsencrypt:/opt/flyingfish/node_modules/flyingfish_plugin_letsencrypt
      # Read-only: the CA pool the pkiserver exports, read to seed the mTLS client
      # CA (no boot dependency on the pkiserver — avoids the ordering cycle).
      - flyingfishPkiCa:/var/lib/flyingfish-pki-ca:ro
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_DB_INFLUX_URL: "${INFLUXDB_URL}"
      FLYINGFISH_DB_INFLUX_TOKEN: "${INFLUXDB_ADMIN_TOKEN}"
      FLYINGFISH_DB_INFLUX_ORG: "${INFLUXDB_ORG}"
      FLYINGFISH_DB_INFLUX_BUCKET: "${INFLUXDB_BUCKET}"
      FLYINGFISH_HTTPSERVER_PORT: "${HTTPSERVER_PORT}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_DYNDNSSERVER_ENABLE: "${DYNDNSSERVER_ENABLE}"
      FLYINGFISH_DB_REDIS_URL: "${REDIS_URL}"
      FLYINGFISH_DB_REDIS_PASSWORD: "${REDIS_REQUIREPASS}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      # Node PKI (v2 mTLS): the CA pool file to authenticate part client certs
      # against, and the pkiserver URL to refresh the revocation list at runtime.
      FLYINGFISH_PKI_CA_FILE: /var/lib/flyingfish-pki-ca/ca-pool.json
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      # nginx runs in its own container (nginxserver, 9.2.2) - this pair flips
      # NginxService into remote mode instead of spawning nginx locally here.
      FLYINGFISH_NGINX_SECRET: "${NGINX_SECRET}"
      FLYINGFISH_NGINX_REMOTE_URL: "${NGINX_REMOTE_URL}"
    ports:
      - "${HTTPSERVER_PORT}:${HTTPSERVER_PORT}"
      - "1900:1900"
      - "10901:10901"
      # - "9229:9229"  # Node debugger port only when needed (opt-in, see command)
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.3
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    healthcheck:
      # Gates the part containers below (they trust this cert via
      # NODE_EXTRA_CA_CERTS, see 9.2.1) - only mark this container healthy once
      # the self-signed cert has actually been generated/persisted.
      test: [ "CMD", "test", "-f", "/var/lib/flyingfish/ssl/server.crt" ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    command:
      - node
      # Debug opt-in: uncomment the next line only when needed. --inspect-brk halts
      # startup until a debugger connects on 9229 - NOT for default/prod, and never
      # expose it permanently on 0.0.0.0.
      # - "--inspect-brk=0.0.0.0:9229"
      - "backend/dist/main.js"
      - "--envargs=1"

  nginxserver:
    image: flyingfish_nginxserver:v1.1.13
    build:
      context: ./
      dockerfile: ./nginxserver/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_nginxserver
    volumes:
      - ./nginx:/opt/flyingfish/nginx:rw
      - flyingfishLetsencrypt:/etc/letsencrypt:rw
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishNginxPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_NGINX_SECRET: "${NGINX_SECRET}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "443:443"
      - "80:80"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.9
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  himhip:
    image: flyingfish_himip:v1.1.13
    build:
      context: ./
      dockerfile: ./himhip/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_himhip
    volumes:
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishHimhipPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_DB_REDIS_PASSWORD: "${REDIS_REQUIREPASS}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL_HOST}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      # network_mode: host - reach the host-published pkiserver via loopback.
      FLYINGFISH_PKI_URL: "http://127.0.0.1:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    network_mode: host
    # HimHIP only reads routes/ARP (ip route, arp) - NET_ADMIN is enough, not cap ALL.
    cap_add:
      - NET_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      redis:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  netfilter:
    image: flyingfish_netfilter:v1.1.13
    build:
      context: ./
      dockerfile: ./netfilter/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_netfilter
    volumes:
      # Read-only: only the backend's self-signed cert to trust it over HTTPS.
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity.
      - flyingfishNetfilterPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket to fetch a single-use enrollment token.
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL_HOST}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # network_mode: host - reach the host-published pkiserver via loopback.
      FLYINGFISH_PKI_URL: "http://127.0.0.1:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    # host networking: it manages the host's nftables ruleset + forwarding sysctls
    # (net.ipv4.ip_forward etc. set at runtime via `sysctl -w`, which needs the host
    # network namespace + NET_ADMIN — so no compose `sysctls:` block, which host-net
    # does not support for network sysctls).
    network_mode: host
    cap_add:
      - NET_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  wan:
    image: flyingfish_wan:v1.1.13
    build:
      context: ./
      dockerfile: ./wan/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_wan
    volumes:
      - flyingfish:/var/lib/flyingfish:ro
      - flyingfishWanPki:/var/lib/flyingfish-pki
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL_HOST}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      FLYINGFISH_PKI_URL: "http://127.0.0.1:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    # host networking + NET_ADMIN: it runs the WAN DHCP client (udhcpc) directly on the
    # host uplink interface, which needs the host network namespace.
    network_mode: host
    cap_add:
      - NET_ADMIN
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  sshremote:
    image: flyingfish_ssh:v1.1.13
    build:
      context: ./
      dockerfile: ./sshserver/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_ssh
    volumes:
      # /var/lib/flyingfish is mounted read-only below (CA cert trust) - this
      # nested mount at the actual SSH host-key path (flyingfish_sshpath default,
      # see sshserver/inc/Config/Config.ts) takes precedence and stays writable.
      - flyingfishSsh:/var/lib/flyingfish/ssh:rw
      - ./sshserver/dist:/opt/flyingfish/sshserver/dist
      - ./sshserver/node_modules:/opt/flyingfish/sshserver/node_modules
      - ./sshserver/package.json:/opt/flyingfish/sshserver/package.json
      - ./node_modules:/opt/flyingfish/node_modules
      - ./package.json:/opt/flyingfish/package.json
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishSshPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_DB_REDIS_URL: "${REDIS_URL}"
      FLYINGFISH_DB_REDIS_PASSWORD: "${REDIS_REQUIREPASS}"
      FLYINGFISH_HTTPSERVER_PORT: "${HTTPSERVER_PORT}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "2222:22"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.4
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  ddnsserver:
    image: flyingfish_ddns:v1.1.13
    build:
      context: ./
      dockerfile: ./ddnsserver/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_ddns
    volumes:
      - ./ddnsserver/dist:/opt/flyingfish/ddnsserver/dist
      - ./ddnsserver/node_modules:/opt/flyingfish/ddnsserver/node_modules
      - ./ddnsserver/package.json:/opt/flyingfish/ddnsserver/package.json
      - ./node_modules:/opt/flyingfish/node_modules
      - ./package.json:/opt/flyingfish/package.json
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishDdnsPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert; the bootstrap token is fetched over the shared unix socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
#    ports:
#      - "9229:9229"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.6
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started
#    command:
#      - node
#      - "--inspect-brk=0.0.0.0:9229"
#      - "ddnsserver/dist/main.js"
#      - "ddnsserver/dist/main.js"
#      - "--envargs=1"

  dnsserver:
    image: flyingfish_dns:v1.1.13
    build:
      context: ./
      dockerfile: ./dnsserver/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_dns
    volumes:
      - ./dnsserver/dist:/opt/flyingfish/dnsserver/dist
      - ./dnsserver/node_modules:/opt/flyingfish/dnsserver/node_modules
      - ./dnsserver/package.json:/opt/flyingfish/dnsserver/package.json
      - ./node_modules:/opt/flyingfish/node_modules
      - ./package.json:/opt/flyingfish/package.json
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable store for this node's own PKI identity (the shared flyingfish
      # volume above is read-only), used when node PKI enrollment is enabled.
      - flyingfishDnsPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: the part fetches a single-use enrollment token
      # from the pkiserver over this socket (trust by co-location, 9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (v2, 9.4.3-D): enroll + auto-renew of this part's own service
      # cert. The bootstrap token is fetched from the pkiserver over the shared
      # unix socket, so enrollment is live without a pre-shared token.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "5333:5333/udp"
      - "5333:5333/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.8
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  pkiserver:
    image: flyingfish_pki:v1.1.13
    build:
      context: ./
      dockerfile: ./pkiserver/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_pki
    volumes:
      - ./pkiserver/dist:/opt/flyingfish/pkiserver/dist
      - ./pkiserver/node_modules:/opt/flyingfish/pkiserver/node_modules
      - ./pkiserver/package.json:/opt/flyingfish/pkiserver/package.json
      - ./node_modules:/opt/flyingfish/node_modules
      - ./package.json:/opt/flyingfish/package.json
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS, see 9.2.1).
      - flyingfish:/var/lib/flyingfish:ro
      # Shared bootstrap socket: the pkiserver vends single-use enrollment tokens
      # to co-located parts here (9.4.3-D).
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
      # Shared CA pool: the pkiserver exports root + intermediates here for the
      # Hub to read (mTLS client CA, avoids the boot ordering cycle).
      - flyingfishPkiCa:/var/lib/flyingfish-pki-ca
    environment:
      FLYINGFISH_DB_MYSQL_USERNAME: "${MARIADB_ROOT_USERNAME}"
      FLYINGFISH_DB_MYSQL_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
      FLYINGFISH_DB_MYSQL_DATABASE: "${MARIADB_DATABASE}"
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      FLYINGFISH_PKISERVER_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
      FLYINGFISH_PKISERVER_CA_EXPORT_FILE: /var/lib/flyingfish-pki-ca/ca-pool.json
    ports:
      - "5334:5334/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.10
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      mariadb:
        condition: service_healthy
      flyingfish:
        condition: service_healthy

  clusterserver:
    image: flyingfish_cluster:v1.1.13
    build:
      context: ./
      dockerfile: ./clusterserver/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_cluster
    volumes:
      - ./clusterserver/dist:/opt/flyingfish/clusterserver/dist
      - ./clusterserver/node_modules:/opt/flyingfish/clusterserver/node_modules
      - ./clusterserver/package.json:/opt/flyingfish/clusterserver/package.json
      - ./node_modules:/opt/flyingfish/node_modules
      - ./package.json:/opt/flyingfish/package.json
      # Read-only: only needs the backend's self-signed cert to trust it over
      # HTTPS for registry self-registration (NODE_EXTRA_CA_CERTS).
      - flyingfish:/var/lib/flyingfish:ro
      # Writable node identity (the shared flyingfish volume is read-only).
      - flyingfishClusterPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: fetch a single-use cluster enrollment token.
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (cluster identity, 9.5.9): enroll under the cluster CA purpose;
      # the bootstrap token is fetched from the pkiserver over the shared socket.
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
    ports:
      - "5335:5335/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.11
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

  clusterdatapath:
    image: flyingfish_datapath:v1.0.0
    build:
      context: ./
      dockerfile: ./clusterdatapath/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY_INTERN}
    container_name: flyingfish_datapath
    # The data plane needs a TUN device for L3 forwarding.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./clusterdatapath/dist:/opt/flyingfish/clusterdatapath/dist
      - ./clusterdatapath/node_modules:/opt/flyingfish/clusterdatapath/node_modules
      - ./clusterdatapath/package.json:/opt/flyingfish/clusterdatapath/package.json
      - ./node_modules:/opt/flyingfish/node_modules
      - ./package.json:/opt/flyingfish/package.json
      # Read-only: the backend's self-signed cert for HTTPS registry trust.
      - flyingfish:/var/lib/flyingfish:ro
      # Writable node identity (its own cluster PKI identity).
      - flyingfishDatapathPki:/var/lib/flyingfish-pki
      # Shared bootstrap socket: fetch a single-use cluster enrollment token.
      - flyingfishPkiBootstrap:/var/lib/flyingfish-pki-bootstrap
    environment:
      FLYINGFISH_LOGGING_LEVEL: "${LOGGING_LEVEL}"
      FLYINGFISH_REGISTRY_SECRET: "${REGISTRY_SECRET}"
      FLYINGFISH_REGISTRY_URL: "${REGISTRY_URL}"
      NODE_EXTRA_CA_CERTS: /var/lib/flyingfish/ssl/server.crt
      # Node PKI (own cluster identity, 9.5.9).
      FLYINGFISH_PKI_URL: "http://10.103.0.10:5334"
      FLYINGFISH_PKI_STORE_DIR: /var/lib/flyingfish-pki
      FLYINGFISH_PKI_BOOTSTRAP_SOCKET: /var/lib/flyingfish-pki-bootstrap/enroll.sock
      # Mesh data plane (9.5.1): QUIC transport, this node's overlay IP, and the
      # host address peers dial it at (its flyingfishNet IP).
      FLYINGFISH_CLUSTER_TRANSPORT: "quic"
      FLYINGFISH_CLUSTER_ADVERTISE_HOST: "10.103.0.12"
      FLYINGFISH_CLUSTER_OVERLAY_IP: "10.42.0.11"
      FLYINGFISH_CLUSTER_OVERLAY_NETMASK: "255.255.0.0"
      # L4 tunnels (9.5.2): expose an arbitrary TCP or UDP service that lives on/behind
      # another cluster node. JSON array of rules; each binds a local ingress port
      # ("proto":"udp" for UDP, default tcp) and forwards every connection/flow over
      # the mesh to egressNodeUid, which dials targetHost:targetPort. Publish the
      # listenPort under `ports` below to reach it from outside the container. Add
      # "proxyProtocol":true (TCP only) to prepend a PROXY protocol v2 header so the
      # backend sees the real client IP (9.5.3). Example (commented — set egressNodeUid
      # to a real datapath nodeUid):
      # FLYINGFISH_CLUSTER_TUNNELS: '[{"listenPort":6379,"egressNodeUid":"<peer-nodeUid>","targetHost":"10.0.0.5","targetPort":6379,"proxyProtocol":true}]'
    ports:
      - "5337:5337/tcp"
    networks:
      flyingfishNet:
        ipv4_address: 10.103.0.12
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    depends_on:
      flyingfish:
        condition: service_healthy
      pkiserver:
        condition: service_started

